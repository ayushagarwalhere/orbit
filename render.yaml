# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# A single long-running instance keeps state consistent (unlike serverless instances).
# Fill the secret values (sync: false) in the Render dashboard.
services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ledger
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ORBIT_CHAIN
        value: base-sepolia
      - key: ORBIT_ANCHOR_ADDRESS
        sync: false
      - key: ORBIT_ANCHOR_PRIVATE_KEY
        sync: false
      - key: ORBIT_KEYSTORE
        sync: false
      - key: ORBIT_DEMO_MODE
        value: "1"
      # Free instances lose their disk on every spin-down. Start (and demo-reset) from a ledger that is
      # already anchored and witnessed on-chain, instead of seeding a new one each time (see deploy/README.md).
      # Requires ORBIT_KEYSTORE to be the keystore that signed it.
      - key: ORBIT_SNAPSHOT
        value: deploy/ledger.jsonl
