name: Keep demo awake

# Render's free tier puts the demo to sleep after 15 minutes without traffic, and the next visitor
# then waits ~50 s. This read-only ping every 5 minutes keeps it awake for judges. It never writes,
# so it never triggers an on-chain anchor.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live demo
        run: |
          curl -sS -o /dev/null --max-time 120 --retry 3 --retry-delay 10 \
            -w "HTTP %{http_code} in %{time_total}s\n" https://orbit-yp30.onrender.com/api/ledger
